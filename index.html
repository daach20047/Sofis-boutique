<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8508a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>De Sofi’s Boutique · Control</title>
<style>
:root{--bg:#fff7fa;--cd:#fff;--tx:#3a2a31;--mu:#8a7480;--pk:#e8508a;--gd:#b8892b;--bd:#f3d3e0;--ok:#1f9d63;--bad:#d93f4f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1519;--cd:#2a1f25;--tx:#f6e9ee;--mu:#b9a2ad;--pk:#ff7fae;--gd:#e0b256;--bd:#4a3640;--ok:#4cd694;--bad:#ff7a87;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1519;--cd:#2a1f25;--tx:#f6e9ee;--mu:#b9a2ad;--pk:#ff7fae;--gd:#e0b256;--bd:#4a3640;--ok:#4cd694;--bad:#ff7a87;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 16px 6px;display:flex;align-items:center;gap:10px}header h1{margin:0;font-size:19px;color:var(--pk)}header small{color:var(--gd);display:block;font-size:12px}
nav{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}
nav button.on{background:var(--pk);color:#fff;border-color:var(--pk)}
main{padding:8px 12px 40px;max-width:1000px;margin:auto}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k,.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px}
.k b{display:block;font-size:19px;margin-top:2px}.k span{color:var(--mu);font-size:12px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mu{color:var(--mu)}
h2{font-size:16px;margin:14px 0 8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
input,select,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:9px;width:100%}
.bar input,.bar select{width:auto;flex:1;min-width:120px}
.btn{border:0;background:var(--pk);color:#fff;padding:9px 14px;border-radius:10px;font:inherit;cursor:pointer;white-space:nowrap}
.btn.s{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}.btn.x{background:var(--bad)}.btn.t{padding:5px 9px;font-size:13px}
.w{overflow-x:auto;background:var(--cd);border:1px solid var(--bd);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:640px}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mu);font-weight:600}td.r,th.r{text-align:right}tr:last-child td{border-bottom:0}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--bd);gap:8px}.row:last-child{border:0}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:12px;color:var(--mu);display:block}.f .full{grid-column:1/-1}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--cd);color:var(--tx);width:min(460px,94vw);padding:16px}dialog::backdrop{background:#0006}
.pv{background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
#toast.on{opacity:1}
.tag{display:inline-block;background:var(--bd);border-radius:8px;padding:1px 8px;font-size:12px}
.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font:inherit;color:var(--mu);cursor:pointer}.seg button.on{background:var(--pk);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:6px 12px;border-radius:16px;font:inherit;font-size:13px;cursor:pointer}.chips button.on{border-color:var(--pk);background:var(--pk);color:#fff}
.step{display:flex;gap:6px}.step input{text-align:center}.step button{width:44px;flex:none;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;font-size:20px;cursor:pointer}
.inv{border-color:var(--bad)!important;box-shadow:0 0 0 3px #d93f4f22}
.sv{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-top:12px}.sv .btn{padding:12px 18px;font-weight:600}
.act{display:flex;gap:8px;position:sticky;bottom:-16px;background:var(--cd);padding:10px 0 2px;margin:8px 0 0}.act .btn{flex:1;padding:11px}
.ck{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:28px;margin:4px auto 10px;animation:pop .35s}@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}@media(prefers-reduced-motion:reduce){.ck{animation:none}}
.pb{height:6px;background:var(--bd);border-radius:4px;margin:-3px 0 8px}.pb i{display:block;height:100%;background:var(--gd);border-radius:4px}
.b1{fill:var(--pk)}.b2{fill:var(--ok)}.lb{fill:var(--mu);font-size:10px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pk);outline-offset:2px}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-bottom:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
#lg{position:fixed;inset:0;background:var(--bg);z-index:100;display:grid;place-items:center;padding:20px}#lg[hidden]{display:none}#lg .cd{width:min(380px,100%)}
</style></head><body>
<header><div style="font-size:30px">🐝</div><div><h1>De Sofi’s Boutique</h1><small>Inventario · Ventas · Costos · Ganancias</small></div><div style="margin-left:auto;text-align:right"><small id="st" style="color:var(--mu)"></small><br><button class="btn t s" onclick="logout()">Salir</button></div></header>
<nav id="nav"></nav><main id="v"></main><dialog id="dlg"></dialog><div id="lg" hidden><form class="cd" onsubmit="return login(event)"><div style="font-size:34px;text-align:center">🐝</div><h2 style="text-align:center;color:var(--pk)">De Sofi’s Boutique</h2><div class="f"><div class="full"><label>Correo</label><input id="lem" type="email" autocomplete="username" required></div><div class="full"><label>Contraseña</label><input id="lpw" type="password" autocomplete="current-password" required></div></div><p id="le" class="bad" style="min-height:20px;font-size:13px"></p><button id="lb" class="btn" style="width:100%;padding:12px">Entrar</button></form></div><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const K='sofis_v1',K2='sofis_cloud';let S={p:[],m:[]},L0=null;try{const r=localStorage.getItem(K);if(r)L0=JSON.parse(r);const r2=localStorage.getItem(K2);if(r2)S=JSON.parse(r2)}catch(e){}
S.c=S.c||[];S.x=S.x||[];
const save=()=>{try{localStorage.setItem(K2,JSON.stringify(S))}catch(e){}push()};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C=n=>'C$ '+(+n||0).toLocaleString('es-NI',{minimumFractionDigits:2,maximumFractionDigits:2});
const day=(o=0)=>{const d=new Date(Date.now()-o*864e5);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=id=>parseFloat($('#'+id).value)||0;
let tab='res',q='',cq='',SC={n:'',p:''},per='mes',F={t:'',a:'',b:''};
const tabs=[['res','📊 Resumen'],['inv','📦 Inventario'],['ven','🛒 Vender'],['cli','👥 Clientes'],['cos','💸 Costos'],['rep','📊 Reportería']];
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000)}
function go(t){tab=t;draw()}
function from(){return per=='hoy'?day():per=='sem'?day(6):per=='mes'?day().slice(0,7)+'-01':''}
function log(t,p,qty,cost,price,note){S.m.push({id:uid(),d:day(),t,pid:p.id,n:p.name,c:p.cat,q:qty,cost,price,tot:qty*(t=='venta'?price:cost),g:t=='venta'?(price-cost)*qty:0,note:note||''})}
function draw(){if(tab=='rep'&&!OWN)tab='res';
 $('#nav').innerHTML=tabs.filter(t=>OWN||t[0]!='rep').map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 $('#v').innerHTML=({res:vRes,inv:vInv,ven:vVen,cli:vCli,rep:vRep,cos:vCos})[tab]();if(tab=='ven')pvS();
}
function vRes(){
 const f=from(),ms=S.m.filter(m=>m.t=='venta'&&m.d>=f);
 const vt=ms.reduce((a,m)=>a+m.tot,0),gn=ms.reduce((a,m)=>a+m.g,0);
 const inv=S.p.reduce((a,p)=>a+p.stock*p.cost,0),pot=S.p.reduce((a,p)=>a+p.stock*p.price,0);
 const low=S.p.filter(p=>p.stock<=3);
 const agg=(key)=>{const o={};ms.forEach(m=>{const k=m[key];o[k]=o[k]||{n:k,q:0,t:0,g:0};o[k].q+=m.q;o[k].t+=m.tot;o[k].g+=m.g});return Object.values(o).sort((a,b)=>b.q-a.q)};
 const rows=(a)=>a.length?a.slice(0,8).map(x=>`<div class="row"><span>${esc(x.n)}</span><span><b>${x.q}</b> uds · ${C(x.t)} · <span class="ok">${C(x.g)}</span></span></div>`).join(''):'<p class="mu">Sin ventas en este período.</p>';
 return `<div class="bar"><select onchange="per=this.value;draw()">${[['hoy','Hoy'],['sem','Últimos 7 días'],['mes','Este mes'],['todo','Todo']].map(([k,l])=>`<option value="${k}" ${per==k?'selected':''}>${l}</option>`).join('')}</select></div>
 <div class="g"><div class="k"><span>Ventas</span><b>${C(vt)}</b></div><div class="k"><span>Ganancia</span><b class="ok">${C(gn)}</b></div><div class="k"><span>Margen</span><b>${vt?(gn/vt*100).toFixed(1):0}%</b></div><div class="k"><span>Inventario (a costo)</span><b>${C(inv)}</b></div><div class="k"><span>Inventario (a precio venta)</span><b>${C(pot)}</b></div><div class="k"><span>Productos / Stock bajo</span><b>${S.p.length} / <span class="${low.length?'bad':''}">${low.length}</span></b></div></div>
 <h2>🏆 Productos más vendidos</h2><div class="cd">${rows(agg('n'))}</div>
 <h2>🗂️ Categorías más vendidas</h2><div class="cd">${rows(agg('c'))}</div>
 ${low.length?`<h2>⚠️ Stock bajo (3 o menos)</h2><div class="cd">${low.map(p=>`<div class="row"><span>${esc(p.name)}</span><b class="bad">${p.stock}</b></div>`).join('')}</div>`:''}`;
}
function vInv(){
 const l=S.p.filter(p=>(p.name+p.cat).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
 return `<div class="bar"><input placeholder="Buscar producto o categoría…" value="${esc(q)}" oninput="q=this.value;draw();const i=document.querySelector('.bar input');i.focus();i.setSelectionRange(q.length,q.length)"><button class="btn" onclick="openProd()">+ Nuevo producto</button></div>
 <div class="w"><table><tr><th>Producto</th><th>Categoría</th><th class="r">Compra</th><th class="r">Venta</th><th class="r">Ganancia</th><th class="r">%</th><th class="r">Stock</th><th></th></tr>
 ${l.map(p=>{const g=p.price-p.cost;return `<tr><td>${esc(p.name)}</td><td><span class="tag">${esc(p.cat)}</span></td><td class="r">${C(p.cost)}</td><td class="r">${C(p.price)}</td><td class="r ${g>=0?'ok':'bad'}">${C(g)}</td><td class="r">${p.cost?(g/p.cost*100).toFixed(0):'–'}%</td><td class="r ${p.stock<=3?'bad':''}"><b>${p.stock}</b></td><td><button class="btn t" onclick="openStock('${p.id}')">+Stock</button> <button class="btn t s" onclick="openProd('${p.id}')">Editar</button> <button class="btn t s" onclick="askDel('${p.id}')">🗑</button></td></tr>`}).join('')||'<tr><td colspan="8" class="mu">Aún no hay productos. Toca “+ Nuevo producto”.</td></tr>'}
 </table></div>`;
}
let selP='';
function vVen(){
 const av=S.p.filter(p=>p.stock>0);if(!av.find(p=>p.id==selP))selP=av[0]?av[0].id:'';
 const p=S.p.find(x=>x.id==selP);
 if(!av.length)return '<div class="cd mu">No hay productos con stock. Agrega inventario primero.</div>';
 return `<div class="cd"><h2 style="margin-top:0">Registrar venta</h2><div class="f">
 <div class="full"><label>Producto</label><select id="sp" onchange="selP=this.value;draw()">${av.map(x=>`<option value="${x.id}" ${x.id==selP?'selected':''}>${esc(x.name)} (stock ${x.stock})</option>`).join('')}</select></div>
 <div><label>Cantidad</label><div class="step"><button type="button" onclick="stp(-1)" aria-label="Menos">−</button><input id="sq" type="number" min="1" inputmode="numeric" value="1" oninput="pvS()"><button type="button" onclick="stp(1)" aria-label="Más">+</button></div></div>
 <div><label>Precio unitario</label><input id="sc" type="number" step="0.01" value="${p.price}" oninput="pvS()"></div>
 <div><label>Cliente</label><input id="scn" list="cll" value="${esc(SC.n)}" oninput="SC.n=this.value;fillPh()"><datalist id="cll">${S.c.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist></div><div><label>Celular</label><input id="sph" type="tel" value="${esc(SC.p)}" oninput="SC.p=this.value"></div><div><label>Fecha</label><input id="sf" type="date" value="${day()}" max="${day()}"></div><div><label>Nota (opcional)</label><input id="sn"></div></div>
 <div class="sv"><div id="spv"></div><button class="btn" onclick="sell()">Registrar venta</button></div></div>`;
}
function pvS(){const p=S.p.find(x=>x.id==selP);if(!p)return;const q=num('sq'),pr=num('sc');$('#spv').innerHTML=`Total <b style="font-size:19px">${C(q*pr)}</b><br><small class="mu">Ganancia <b class="${pr>=p.cost?'ok':'bad'}">${C((pr-p.cost)*q)}</b></small>`}
function sell(){const p=S.p.find(x=>x.id==selP),q=Math.floor(num('sq')),pr=num('sc');
 if(!p||q<1)return bad('sq','La cantidad debe ser 1 o más');if(q>p.stock)return bad('sq','Solo hay '+p.stock+' en stock');
 p.stock-=q;let cid='';const cnm=$('#scn').value.trim(),ph=$('#sph').value.trim();
 if(cnm){let c=S.c.find(x=>x.name.toLowerCase()==cnm.toLowerCase());if(!c){c={id:uid(),name:cnm,phone:ph};S.c.push(c)}else if(ph&&!c.phone)c.phone=ph;cid=c.id}
 log('venta',p,q,p.cost,pr,$('#sn').value);const mv=S.m[S.m.length-1];mv.cid=cid;mv.d=$('#sf').value||day();SC={n:'',p:''};save();draw();done('Venta registrada',[['Producto',esc(p.name)+' ×'+q],['Cliente',esc(cnm)||'Sin nombre'],['Total',C(mv.tot)],['Ganancia',C(mv.g)]])}
function vMov(){
 const l=S.m.filter(m=>(!F.t||m.t==F.t)&&(!F.a||m.d>=F.a)&&(!F.b||m.d<=F.b)).slice().reverse();
 const v=l.filter(m=>m.t=='venta'),cmp=l.filter(m=>m.t=='compra');
 return `<div class="bar"><select onchange="F.t=this.value;draw()"><option value="">Todos los movimientos</option>${['venta','compra','ajuste'].map(t=>`<option ${F.t==t?'selected':''} value="${t}">${t[0].toUpperCase()+t.slice(1)}s</option>`).join('')}</select>
 <input type="date" value="${F.a}" onchange="F.a=this.value;draw()"><input type="date" value="${F.b}" onchange="F.b=this.value;draw()"></div>
 <div class="g"><div class="k"><span>Vendido</span><b>${C(v.reduce((a,m)=>a+m.tot,0))}</b></div><div class="k"><span>Ganancia</span><b class="ok">${C(v.reduce((a,m)=>a+m.g,0))}</b></div><div class="k"><span>Comprado</span><b>${C(cmp.reduce((a,m)=>a+m.tot,0))}</b></div></div>
 <div class="bar"><button class="btn s" onclick="expCSV()">Exportar CSV</button><button class="btn s" onclick="expJSON()">Respaldo</button><button class="btn s" onclick="impJSON()">Restaurar</button></div>
 <div class="w"><table><tr><th>Fecha</th><th>Tipo</th><th>Producto</th><th>Cliente</th><th>Categoría</th><th class="r">Cant.</th><th class="r">Precio</th><th class="r">Total</th><th class="r">Ganancia</th><th>Nota</th></tr>
 ${l.map(m=>`<tr><td>${m.d}</td><td><span class="tag">${m.t}</span></td><td>${esc(m.n)}</td><td>${esc(cn(m))}</td><td>${esc(m.c)}</td><td class="r">${m.q}</td><td class="r">${C(m.t=='venta'?m.price:m.cost)}</td><td class="r">${C(m.tot)}</td><td class="r ${m.g>=0?'ok':'bad'}">${m.t=='venta'?C(m.g):'–'}</td><td>${esc(m.note)}</td></tr>`).join('')||'<tr><td colspan="10" class="mu">Sin movimientos.</td></tr>'}
 </table></div>`;
}
const cn=m=>(S.c.find(c=>c.id==m.cid)||{}).name||'',cph=m=>(S.c.find(c=>c.id==m.cid)||{}).phone||'';
function fillPh(){const c=S.c.find(x=>x.name.toLowerCase()==SC.n.trim().toLowerCase());if(c&&c.phone&&!SC.p){SC.p=c.phone;$('#sph').value=c.phone}}
function vCli(){
 const r=S.c.map(c=>{const ms=S.m.filter(m=>m.t=='venta'&&m.cid==c.id),o={};ms.forEach(m=>o[m.n]=(o[m.n]||0)+m.q);return{c,n:ms.length,tot:ms.reduce((a,m)=>a+m.tot,0),last:ms.length?ms[ms.length-1].d:'–',pr:Object.entries(o).map(([k,v])=>esc(k)+' ×'+v).join(', ')}}).filter(x=>(x.c.name+x.c.phone).toLowerCase().includes(cq.toLowerCase())).sort((a,b)=>b.tot-a.tot);
 return `<div class="bar"><input placeholder="Buscar cliente o celular…" value="${esc(cq)}" oninput="cq=this.value;draw();const i=document.querySelector('.bar input');i.focus();i.setSelectionRange(cq.length,cq.length)"><button class="btn" onclick="openCli()">+ Nuevo cliente</button></div>
 <div class="w"><table><tr><th>Cliente</th><th>Celular</th><th>Productos que compró</th><th class="r">Compras</th><th class="r">Total pagado</th><th>Última</th><th></th></tr>
 ${r.map(x=>{const d=(x.c.phone||'').replace(/\D/g,''),w=d.length==8?'505'+d:d;return `<tr><td><b>${esc(x.c.name)}</b></td><td>${esc(x.c.phone)}</td><td style="white-space:normal;min-width:180px">${x.pr||'<span class="mu">–</span>'}</td><td class="r">${x.n}</td><td class="r ok"><b>${C(x.tot)}</b></td><td>${x.last}</td><td>${w?`<a class="btn t s" style="text-decoration:none" target="_blank" href="https://wa.me/${w}">WhatsApp</a> `:''}<button class="btn t s" onclick="openCli('${x.c.id}')">Editar</button></td></tr>`}).join('')||'<tr><td colspan="7" class="mu">Aún no hay clientes. Se crean solos al registrar una venta con nombre, o con “+ Nuevo cliente”.</td></tr>'}
 </table></div>`}
function openCli(id){const c=S.c.find(x=>x.id==id)||{name:'',phone:''};
 D.innerHTML=`<h2 style="margin-top:0">${id?'Editar':'Nuevo'} cliente</h2><div class="f"><div class="full"><label>Nombre</label><input id="cn1" value="${esc(c.name)}"></div><div class="full"><label>Celular</label><input id="cp1" type="tel" value="${esc(c.phone)}"></div></div><p class="act"><button class="btn s" onclick="D.close()">Cancelar</button><button class="btn" onclick="saveCli('${id||''}')">Guardar</button></p>`;D.showModal()}
function saveCli(id){const n=$('#cn1').value.trim();if(!n)return bad('cn1','Escribe el nombre del cliente');const p=$('#cp1').value.trim();
 if(id){const c=S.c.find(x=>x.id==id);c.name=n;c.phone=p}else S.c.push({id:uid(),name:n,phone:p});save();D.close();toast('Guardado ✔');draw()}
const D=$('#dlg');
function openProd(id){const p=S.p.find(x=>x.id==id)||{name:'',cat:'',cost:'',price:'',stock:''};
 const cats=[...new Set(S.p.map(x=>x.cat))];
 D.innerHTML=`<h2 style="margin-top:0">${id?'Editar':'Nuevo'} producto</h2><div class="f">

function vRep(){return `<div class="seg" style="margin-bottom:12px"><button class="${rv=='dash'?'on':''}" onclick="rv='dash';draw()">Dashboard</button><button class="${rv=='mov'?'on':''}" onclick="rv='mov';draw()">Movimientos</button></div>`+(rv=='dash'?vDash():vMov())}
function vDash(){
 const f=rp=='hoy'?day():rp=='sem'?day(6):rp=='mes'?day().slice(0,7)+'-01':'';
 const ms=S.m.filter(m=>m.d>=f),v=ms.filter(m=>m.t=='venta'),cp=ms.filter(m=>m.t=='compra'),xs=S.x.filter(x=>x.d>=f);
 const sum=(a,k)=>a.reduce((s,o)=>s+o[k],0);
 const vt=sum(v,'tot'),gb=sum(v,'g'),inv=sum(cp,'tot'),fj=sum(xs.filter(x=>x.t=='fijo'),'amt'),vr=sum(xs.filter(x=>x.t=='variable'),'amt'),net=gb-fj-vr;
 const n=rp=='hoy'?1:rp=='sem'?7:+day().slice(8),mo=rp=='todo';
 const keys=mo?Array.from({length:6},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}):Array.from({length:n},(_,i)=>day(n-1-i));
 const L=mo?7:10,sv=keys.map(k=>sum(v.filter(m=>m.d.slice(0,L)==k),'tot')),gv=keys.map(k=>sum(v.filter(m=>m.d.slice(0,L)==k),'g')),mx=Math.max(1,...sv),w=600/keys.length,bw=Math.min(18,w*.38);
 const chart=`<svg viewBox="0 0 600 190" style="width:100%;height:auto" role="img" aria-label="Ventas y ganancia">${keys.map((k,i)=>{const x=i*w+w/2,h1=sv[i]/mx*150,h2=Math.max(0,gv[i])/mx*150;return `<rect class="b1" x="${x-bw}" y="${160-h1}" width="${bw}" height="${h1}" rx="2"><title>${k}: ${C(sv[i])}</title></rect><rect class="b2" x="${x}" y="${160-h2}" width="${bw}" height="${h2}" rx="2"><title>${k}: ${C(gv[i])}</title></rect>${(keys.length<=8||i%Math.ceil(keys.length/8)==0)?`<text class="lb" x="${x}" y="178" text-anchor="middle">${mo?k.slice(2):k.slice(5)}</text>`:''}`}).join('')}</svg>`;
 const cat={};xs.forEach(x=>cat[x.cat+' ('+x.t+')']=(cat[x.cat+' ('+x.t+')']||0)+x.amt);const ce=Object.entries(cat).sort((a,b)=>b[1]-a[1]),cm=ce.length?ce[0][1]:1;
 const pr={};v.forEach(m=>{const o=pr[m.n]=pr[m.n]||{q:0,t:0,g:0};o.q+=m.q;o.t+=m.tot;o.g+=m.g});const top=Object.entries(pr).sort((a,b)=>b[1].t-a[1].t).slice(0,5);
 const fd=[...ms.map(m=>({d:m.d,t:(m.t=='venta'?'Venta':m.t=='compra'?'Compra':'Ajuste')+' · '+m.n+' ×'+m.q,a:m.t=='venta'?m.tot:m.t=='compra'?-m.tot:0})),...xs.map(x=>({d:x.d,t:'Costo '+x.t+' · '+x.cat+(x.desc?' · '+x.desc:''),a:-x.amt}))].filter(o=>o.a).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,8);
 const K=(l,val,c)=>`<div class="k"><span>${l}</span><b class="${c||''}">${val}</b></div>`;
 return `<div class="bar"><select onchange="rp=this.value;draw()">${[['hoy','Hoy'],['sem','Últimos 7 días'],['mes','Este mes'],['todo','Todo']].map(([k,l])=>`<option value="${k}" ${rp==k?'selected':''}>${l}</option>`).join('')}</select></div>
 <div class="g"><div class="k" style="grid-column:1/-1"><span>Utilidad neta (ganancia − costos fijos y variables)</span><b class="${net>=0?'ok':'bad'}" style="font-size:28px">${C(net)}</b></div>
 ${K('Ventas',C(vt))}${K('Ganancia bruta',C(gb),'ok')}${K('Inversión en inventario',C(inv))}${K('Costos fijos',C(fj),'bad')}${K('Costos variables',C(vr),'bad')}${K('Margen neto',(vt?(net/vt*100).toFixed(1):0)+'%',net>=0?'ok':'bad')}${K('Retorno sobre inversión',(inv?(net/inv*100).toFixed(1):0)+'%',net>=0?'ok':'bad')}</div>
 <h2>${mo?'Ventas por mes (6 meses)':'Ventas por día'}</h2><div class="cd"><div class="lg"><span><i style="background:var(--pk)"></i>Ventas</span><span><i style="background:var(--ok)"></i>Ganancia</span></div>${chart}</div>

 <h2>Últimos movimientos</h2><div class="cd">${fd.map(o=>`<div class="row"><span>${o.d.slice(5)} · ${esc(o.t)}</span><b class="${o.a>0?'ok':'bad'}">${o.a>0?'+':'−'}${C(Math.abs(o.a))}</b></div>`).join('')||'<p class="mu">Aún no hay movimientos.</p>'}</div>`}

const FB={apiKey:"AIzaSyCpimz_TW1t2BzNnMZOugHEnkGUf5UixSM",authDomain:"sofis-boutique-f1776.firebaseapp.com",projectId:"sofis-boutique-f1776",storageBucket:"sofis-boutique-f1776.firebasestorage.app",messagingSenderId:"1084618169373",appId:"1:1084618169373:web:3d651d1bfcc9c50c3a7af4"};
const CN={p:'products',m:'movs',c:'clients',x:'costs'};
let DB=null,U=null,OWN=false,SH={p:{},m:{},c:{},x:{}},un=[],rdy={},migAsked=false;
const sj=o=>JSON.stringify(o,Object.keys(o).sort());
const st=t=>{const e=$('#st');if(e)e.textContent=t};
function rd(){if(D.open)return;const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&$('#v').contains(a))return;draw()}
function boot(){
 if(typeof firebase=='undefined'){$('#lg').hidden=false;$('#le').textContent='Sin conexión. Abre la app con internet al menos una vez.';return}
 firebase.initializeApp(FB);DB=firebase.firestore();DB.enablePersistence({synchronizeTabs:true}).catch(()=>{});
 firebase.auth().onAuthStateChanged(u=>{U=u;if(!u){stopSync();$('#lg').hidden=false;return}$('#lg').hidden=true;startSync()});
 addEventListener('offline',()=>st('⚠ sin conexión'));addEventListener('online',()=>st('☁ conectando…'));
}

 b.disabled=false;return false}
function logout(){if(!confirm('¿Cerrar sesión?'))return;stopSync();try{localStorage.removeItem(K2)}catch(e){}S={p:[],m:[],c:[],x:[]};OWN=false;firebase.auth().signOut()}
function stopSync(){un.forEach(f=>f());un=[];rdy={};migAsked=false}
function startSync(){stopSync();
 un.push(DB.doc('meta/owner').onSnapshot(s=>{if(!s.exists){if(!s.metadata.fromCache)DB.doc('meta/owner').set({uid:U.uid,email:U.email}).catch(()=>{});return}OWN=s.data().uid==U.uid;rd()}));
 for(const k in CN)un.push(DB.collection(CN[k]).onSnapshot(sn=>{
  S[k]=sn.docs.map(d=>({...d.data(),id:d.id}));SH[k]={};S[k].forEach(o=>SH[k][o.id]=JSON.parse(JSON.stringify(o)));
  try{localStorage.setItem(K2,JSON.stringify(S))}catch(e){}
  st(sn.metadata.hasPendingWrites?'⏳ enviando…':navigator.onLine?'☁ al día':'⚠ sin conexión');
  if(!sn.metadata.fromCache)rdy[k]=1;rd();chkMig()},e=>toast('Sin permiso o sin conexión ('+(e.code||'error')+')')))}
function push(){if(!DB||!U)return;const ops=[],F=firebase.firestore.FieldValue;
 for(const k in CN){const cur={};S[k].forEach(o=>cur[o.id]=o);
  for(const id in cur){const o=cur[id],s=SH[k][id],r=DB.collection(CN[k]).doc(id);
   if(!s)ops.push(b=>b.set(r,o));
   else if(sj(o)!=sj(s)){const d={...o};if(k=='p'&&o.stock!==s.stock)d.stock=F.increment(o.stock-s.stock);ops.push(b=>b.set(r,d,{merge:true}))}}
  for(const id in SH[k])if(!cur[id]){const r=DB.collection(CN[k]).doc(id);ops.push(b=>b.delete(r))}
  SH[k]={};for(const id in cur)SH[k][id]=JSON.parse(JSON.stringify(cur[id]))}
 for(let i=0;i<ops.length;i+=400){const b=DB.batch();ops.slice(i,i+400).forEach(g=>g(b));b.commit().catch(e=>toast('No se pudo guardar ('+(e.code||'error')+')'))}
 if(ops.length)st('⏳ enviando…')}
function chkMig(){if(migAsked||!L0||localStorage.getItem('sofis_migrated'))return;if(!['p','m','c','x'].every(k=>rdy[k]))return;
 if(['p','m','c','x'].some(k=>S[k].length))return;const n=a=>(a||[]).length;if(!n(L0.p)&&!n(L0.m)&&!n(L0.c)&&!n(L0.x))return;migAsked=true;
 D.innerHTML=`<h2 style="margin-top:0">Datos encontrados en este dispositivo</h2><p>Hay ${n(L0.p)} productos, ${n(L0.m)} movimientos, ${n(L0.c)} clientes y ${n(L0.x)} costos guardados aquí. ¿Subirlos a la nube para compartirlos con los otros dispositivos?</p><p class="act"><button class="btn s" onclick="D.close()">Ahora no</button><button class="btn" onclick="doMig()">Subir a la nube</button></p>`;D.showModal()}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
draw();
